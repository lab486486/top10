backend:
  name: github
  repo: lab486486/top10
  branch: main
  # Cloudflare Pages Functions(/api/oauth/auth, /api/oauth/callback)를 OAuth 프록시로 사용.
  # base_url 은 admin/index.html 에서 window.location.origin 으로 덮어씁니다.
  auth_endpoint: api/oauth/auth

# 로컬 글쓰기: npx decap-server 후 http://localhost:5173/admin
# 운영에서는 Functions OAuth를 쓰므로 local_backend는 로컬 전용 힌트입니다.
local_backend: true

site_url: https://petfood.pe.kr
logo_url: /petfood-mark.png
display_url: https://petfood.pe.kr/blog
show_preview_links: false

media_folder: public/uploads
public_folder: /uploads

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'

collections:
  - name: blog
    label: 블로그
    label_singular: 게시글
    folder: content/blog
    create: true
    slug: '{{slug}}'
    extension: md
    format: frontmatter
    preview_path: 'blog/{{slug}}'
    summary: '{{title}}'
    sortable_fields: ['date', 'title', 'commit_date']
    editor:
      preview: false
    view_filters:
      - label: 초안만
        field: draft
        pattern: 'true'
    fields:
      - label: 제목
        name: title
        widget: string
        hint: 목록·글 상단에 크게 노출됩니다.

      - label: 날짜
        name: date
        widget: datetime
        format: YYYY-MM-DD HH:mm
        date_format: YYYY-MM-DD
        time_format: HH:mm
        picker_utc: false
        default: '{{now}}'
        hint: 사이트 글에 보이는 발행일입니다. 관리자 목록 오른쪽 시각은 Git 저장 시각을 씁니다.

      - label: 설명
        name: summary
        widget: text
        required: false
        hint: 목록 카드·메타 설명에 쓰일 한두 문장

      - label: 커버 이미지
        name: thumbnail
        widget: image
        required: false
        hint: 목록 썸네일·글 상단 대표 이미지

      - label: 태그
        name: tags
        widget: list
        required: false
        hint: Enter로 태그를 추가합니다
        field:
          label: 태그
          name: tag
          widget: string

      - label: 퍼머링크
        name: permalink
        widget: string
        required: false
        hint: '비우면 제목 기반 파일명 사용. 예: welcome → /blog/welcome'

      - label: 초안
        name: draft
        widget: boolean
        default: false
        required: false
        hint: 켜 두면 사이트에 공개되지 않습니다.

      - label: 본문
        name: body
        widget: markdown
        hint: 제목(##)·목록·이미지로 작성하세요.
        buttons:
          - bold
          - italic
          - code
          - link
          - heading-two
          - heading-three
          - quote
          - bulleted-list
          - numbered-list
        editor_components:
          - image
          - code-block
