backend:
  name: github
  repo: lab486486/top10
  branch: main
  # Cloudflare Pages에는 Git Gateway가 없으므로 GitHub OAuth 프록시(base_url)가 필요합니다.
  # 아래 base_url을 배포한 OAuth Worker 주소로 교체하세요. (README 참고)
  # base_url: https://YOUR-OAUTH-WORKER.example.com
  # auth_endpoint: auth

local_backend: true

site_url: /
logo_url: /favicon.svg

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: blog
    label: 블로그
    label_singular: 게시글
    folder: content/blog
    create: true
    slug: '{{slug}}'
    extension: md
    format: frontmatter
    fields:
      - { label: 제목, name: title, widget: string }
      - { label: 요약, name: summary, widget: text, required: false }
      - { label: 발행일, name: date, widget: datetime }
      - { label: 초안, name: draft, widget: boolean, default: false, required: false }
      - { label: 본문, name: body, widget: markdown }
