<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>PETFOOD · 글쓰기</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=Outfit:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #f4f7f2;
      }

      img[alt='Logo'] {
        max-width: 120px !important;
        height: auto !important;
        object-fit: contain;
      }

      /* 목록 카드: 제목 왼쪽 / 작성시각 오른쪽 (제목 문자열과 분리) */
      .pf-entry-row {
        position: relative !important;
        display: block !important;
        width: 100%;
        padding-right: 9.5rem !important;
        box-sizing: border-box;
      }

      .pf-entry-row .pf-entry-date {
        position: absolute !important;
        right: 0;
        top: 50%;
        transform: translateY(-50%);
        margin: 0 !important;
        font-variant-numeric: tabular-nums;
        font-weight: 600;
        font-size: 0.86rem;
        color: #5b6b62;
        white-space: nowrap;
        text-align: right;
        pointer-events: none;
      }

      /* 글쓰기: 미리보기 없이 2열(제목|날짜, 설명|커버) */
      .pf-editor-grid {
        display: grid !important;
        grid-template-columns: 1fr 1fr;
        gap: 0 1.25rem;
        align-items: start;
      }

      .pf-editor-grid > .pf-span-2 {
        grid-column: 1 / -1;
      }

      @media (max-width: 860px) {
        .pf-editor-grid {
          grid-template-columns: 1fr;
        }

        .pf-entry-row {
          padding-right: 0 !important;
        }

        .pf-entry-row .pf-entry-date {
          position: static !important;
          transform: none;
          display: block;
          margin-top: 0.25rem !important;
          text-align: left;
        }
      }
    </style>
    <script>
      window.CMS_MANUAL_INIT = true
    </script>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      var REPO = 'lab486486/top10'
      var BLOG_FOLDER = 'content/blog'
      var dateCache = Object.create(null)
      var dateInflight = Object.create(null)

      CMS.init({
        config: {
          load_config_file: true,
          backend: {
            name: 'github',
            repo: REPO,
            branch: 'main',
            base_url: window.location.origin,
            auth_endpoint: 'api/oauth/auth',
          },
          site_url: 'https://petfood.pe.kr',
          display_url: 'https://petfood.pe.kr/blog',
          logo_url: '/petfood-mark.png',
          show_preview_links: false,
        },
      })

      function formatStamp(iso) {
        var d = new Date(iso)
        if (Number.isNaN(d.getTime())) return ''
        var y = d.getFullYear()
        var m = String(d.getMonth() + 1).padStart(2, '0')
        var day = String(d.getDate()).padStart(2, '0')
        var hh = String(d.getHours()).padStart(2, '0')
        var mm = String(d.getMinutes()).padStart(2, '0')
        return y + '-' + m + '-' + day + ' ' + hh + ':' + mm
      }

      function authHeaders() {
        var headers = { Accept: 'application/vnd.github+json' }
        try {
          for (var i = 0; i < localStorage.length; i++) {
            var key = localStorage.key(i)
            if (!key || !/decap|netlify-cms/i.test(key)) continue
            var raw = localStorage.getItem(key)
            if (!raw) continue
            var parsed = JSON.parse(raw)
            var token =
              parsed &&
              (parsed.token ||
                (parsed.value && parsed.value.token) ||
                (parsed.data && parsed.data.token))
            if (token) {
              headers.Authorization = 'Bearer ' + token
              break
            }
          }
        } catch (e) {}
        return headers
      }

      function fetchFileWrittenAt(slug) {
        if (dateCache[slug]) return Promise.resolve(dateCache[slug])
        if (dateInflight[slug]) return dateInflight[slug]

        var path = BLOG_FOLDER + '/' + slug + '.md'
        var url =
          'https://api.github.com/repos/' +
          REPO +
          '/commits?path=' +
          encodeURIComponent(path) +
          '&per_page=1'

        dateInflight[slug] = fetch(url, { headers: authHeaders() })
          .then(function (res) {
            if (!res.ok) throw new Error('commits ' + res.status)
            return res.json()
          })
          .then(function (rows) {
            var iso =
              (rows &&
                rows[0] &&
                rows[0].commit &&
                ((rows[0].commit.author && rows[0].commit.author.date) ||
                  (rows[0].commit.committer && rows[0].commit.committer.date))) ||
              ''
            dateCache[slug] = formatStamp(iso) || ''
            return dateCache[slug]
          })
          .catch(function () {
            dateCache[slug] = ''
            return ''
          })
          .finally(function () {
            delete dateInflight[slug]
          })

        return dateInflight[slug]
      }

      function entrySlugFromHref(href) {
        if (!href) return ''
        var m = String(href).match(/collections\/blog\/entries\/([^/?#]+)/i)
        return m ? decodeURIComponent(m[1]) : ''
      }

      function enhanceEntryCards() {
        var links = document.querySelectorAll('a[href*="collections/blog/entries/"]')
        links.forEach(function (link) {
          var slug = entrySlugFromHref(link.getAttribute('href'))
          if (!slug) return

          // 카드 행 컨테이너: 링크 자체 또는 가까운 카드 래퍼
          var row = link
          row.classList.add('pf-entry-row')

          var dateEl = row.querySelector(':scope > .pf-entry-date')
          if (!dateEl) {
            dateEl = document.createElement('span')
            dateEl.className = 'pf-entry-date'
            dateEl.setAttribute('aria-label', '작성 시각')
            row.appendChild(dateEl)
          }

          if (dateCache[slug]) {
            dateEl.textContent = dateCache[slug]
            return
          }

          if (dateEl.dataset.pfLoading === '1') return
          dateEl.dataset.pfLoading = '1'
          dateEl.textContent = ''
          fetchFileWrittenAt(slug).then(function (stamp) {
            dateEl.dataset.pfLoading = '0'
            if (stamp) dateEl.textContent = stamp
          })
        })
      }

      function fieldLabelText(node) {
        var label = node.querySelector('label')
        return label ? (label.textContent || '').trim() : ''
      }

      function enhanceEditorLayout() {
        var panes = document.querySelectorAll('[class*="ControlPane"]')
        panes.forEach(function (pane) {
          if (pane.dataset.pfGrid === '1') return
          var kids = Array.prototype.slice.call(pane.children).filter(function (el) {
            return el.nodeType === 1 && fieldLabelText(el)
          })
          if (kids.length < 4) return
          var labels = kids.map(fieldLabelText)
          if (labels[0].indexOf('제목') === -1 || labels[1].indexOf('날짜') === -1) return
          if (labels[2].indexOf('설명') === -1 || labels[3].indexOf('커버') === -1) return
          pane.dataset.pfGrid = '1'
          pane.classList.add('pf-editor-grid')
          kids.forEach(function (el, i) {
            if (i >= 4) el.classList.add('pf-span-2')
          })
        })
      }

      function tick() {
        enhanceEntryCards()
        enhanceEditorLayout()
      }

      tick()
      var obs = new MutationObserver(function () {
        tick()
      })
      obs.observe(document.documentElement, { childList: true, subtree: true })
    </script>
  </body>
</html>
