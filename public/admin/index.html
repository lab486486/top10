<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>PETFOOD · 글쓰기</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=Outfit:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #f4f7f2;
      }

      /* 로그인 화면 로고 크기 정리 */
      img[alt='Logo'] {
        max-width: 120px !important;
        height: auto !important;
        object-fit: contain;
      }
    </style>
    <script>
      // config.yml 로드 후 backend.base_url 을 현재 도메인으로 덮어쓰기 위해 수동 초기화
      window.CMS_MANUAL_INIT = true
    </script>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      CMS.init({
        config: {
          load_config_file: true,
          backend: {
            name: 'github',
            repo: 'lab486486/top10',
            branch: 'main',
            base_url: window.location.origin,
            auth_endpoint: 'auth',
          },
          logo_url: '/petfood-mark.png',
        },
      })

      CMS.registerPreviewStyle('/admin/preview.css')

      var PostPreview = createClass({
        render: function () {
          var entry = this.props.entry
          var title = entry.getIn(['data', 'title']) || '제목 없음'
          var summary = entry.getIn(['data', 'summary']) || ''
          var date = entry.getIn(['data', 'date'])
          var dateLabel = date
            ? new Date(date).toLocaleDateString('ko-KR', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
              })
            : ''
          var thumb = entry.getIn(['data', 'thumbnail'])
          var thumbUrl = thumb ? this.props.getAsset(thumb) : null

          return h(
            'article',
            { className: 'preview-article' },
            h(
              'header',
              { className: 'preview-article__head' },
              dateLabel && h('time', {}, dateLabel),
              h('h1', {}, title),
              summary && h('p', { className: 'preview-article__summary' }, summary),
            ),
            h(
              'div',
              { className: 'preview-article__layout' },
              h(
                'div',
                { className: 'preview-article__body' },
                thumbUrl &&
                  h('img', {
                    className: 'preview-article__thumb',
                    src: thumbUrl.toString(),
                    alt: '',
                  }),
                this.props.widgetFor('body'),
              ),
              h(
                'aside',
                { className: 'preview-article__aside' },
                h(
                  'div',
                  { className: 'preview-article__aside-inner' },
                  h('strong', {}, '이 글'),
                  dateLabel && h('p', {}, dateLabel),
                  summary && h('p', { className: 'muted' }, summary),
                ),
              ),
            ),
          )
        },
      })

      CMS.registerPreviewTemplate('blog', PostPreview)
    </script>
  </body>
</html>
